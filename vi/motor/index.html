<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tri giác vận động - Demo</title>
<script src="https://unpkg.com/jspsych@8.3.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
<script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
<script src="../../assets/flow.js"></script>
<link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
<style>

  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; background: #f4f6fb;
    display: flex; align-items: center; justify-content: center; }
  #jspsych-content-wrapper, .jspsych-display-element, #jspsych-content {
    height: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important;
    overflow: hidden !important; display: flex !important; align-items: center !important;
    justify-content: center !important;
  }
  /* 고정 크기 프레임(1100×950)을 항상 같은 크기로 그린 뒤, 창 크기에 맞춰 통째로 한 번만 scale합니다. */
  .math-wrap { width: 1300px; height: 950px; box-sizing: border-box; margin: 0;
    padding: 50px 80px; display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; transform-origin: center center; flex-shrink: 0; }
  .content-col { width: 1120px; margin: 0 auto; position: relative; }

  .math-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 52px; }
  .math-tag { font-weight: 700; font-size: 31px; color: #1c3f94; border-left: 6px solid #2554c7;
    padding-left: 16px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .math-progress { background: #2554c7; color: #fff; font-weight: 600; font-size: 20px;
    padding: 12px 26px; border-radius: 26px; }
  .timer-badge { visibility: hidden; background: #fdecea; color: #c62828; border: 2px solid #f3c6c2;
    font-weight: 700; font-size: 20px; padding: 8px 20px; border-radius: 24px; min-width: 64px; text-align: center; }
  .timer-badge.on { visibility: visible; animation: timer-pulse 1s ease-in-out infinite; }
  @keyframes timer-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .info-box { background: #fafbfe; border: 1px solid #e1e6f2; border-radius: 16px;
    padding: 16px 28px; font-size: 27px; line-height: 1.6; color: #2b2b2b; margin-bottom: 14px; min-height: 40px; text-wrap: balance; word-break: keep-all; }
  .info-box b { font-weight: 800; }
  /* outline은 둥근 모서리(border-radius)를 못 따라가는 브라우저가 있고, 크기도 키우고 설명 중 주의를
     끌기 위해 펄스 애니메이션을 넣은 box-shadow 방식으로 통일 */
  .highlight { box-shadow: 0 0 0 6px #e53935; animation: mo-hl-pulse 1.1s ease-in-out infinite; }
  @keyframes mo-hl-pulse { 0%, 100% { box-shadow: 0 0 0 6px #e53935; } 50% { box-shadow: 0 0 0 9px #ff8a80; } }
  .mo-decor-hl { animation: mo-decor-pulse 1.1s ease-in-out infinite; }
  @keyframes mo-decor-pulse { 0%, 100% { border-color: #e53935; } 50% { border-color: #ff8a80; } }
  .mockup-inert { pointer-events: none; user-select: none; }
  .btn-row { text-align: center; margin-top: 20px; }
  .next-btn { display: block; width: 100%; font-size: 31px; font-weight: 700; padding: 18px 0;
    border-radius: 14px; border: none; background: #2554c7; color: white; cursor: pointer; }
  .next-btn:hover { background: #1c3f94; }
  .btn-row .next-btn { display: inline-block; width: auto; min-width: 260px; margin: 0 10px; padding: 16px 36px; white-space: nowrap; border-radius: 40px; }
  .btn-row .secondary-btn { background: #fff; color: #2554c7; border: 2px solid #2554c7; }
  .btn-row .secondary-btn:hover { background: #eaf0fd; }
  button:disabled { cursor: default !important; }
  .nav-arrow-btn { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; border: none;

    box-shadow: 0 10px 24px rgba(37,84,199,0.35); display: flex; align-items: center; justify-content: center; }
  .nav-arrow-btn:hover { background: #1c3f94; }
  .btn-pressed { transform: scale(0.95); filter: brightness(0.9); transition: transform .12s ease, filter .12s ease; }
  .mini-wrap { border: 2px solid #2554c7; border-radius: 20px; padding: 14px; background: #fff; }
  .mini-inner { border: 1px solid #e1e6f2; border-radius: 16px; padding: 8px 20px 12px; zoom: 0.62; }
  .pill { font-family: inherit; padding: 12px 34px; border-radius: 40px; font-weight: 700; font-size: 22px;
    border: 2px solid #cfd6e6; background: #fff; color: #44506b; cursor: pointer; min-width: 200px; white-space: nowrap; }
  .pill.primary { background: #2554c7; color: #fff; border-color: #2554c7; }
  .pill:hover:not(:disabled) { filter: brightness(0.96); }
  .pill:disabled { background: #b9c7ea; border-color: #b9c7ea; color: #fff; }

  /* 타이틀 화면 */
  .title-full { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #f4f6fb; overflow: hidden; }

  /* ── "검사하기/시작하기"를 누른 직후 바로 첫 문제로 넘어가지 않고 3초씩 보여주는
     전환(로딩) 화면 — 수리계산과 동일한 디자인(흰 원 + 구름 모양 장식 + 우측 하단
     느낌표 배지)입니다. .math-wrap 클래스를 그대로 써서 기존 scale 시스템에
     자동으로 맞춰집니다. ── */
  .transition-stage { position: relative; width: 760px; height: 760px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center; }
  .transition-cloud { position: absolute; background: #aebfe6; z-index: 0; }
  .transition-cloud.c1 { width: 230px; height: 200px; top: 30px; right: 60px;
    border-radius: 55% 45% 50% 50% / 60% 55% 45% 40%; }
  .transition-cloud.c2 { width: 120px; height: 120px; top: 190px; right: 0; border-radius: 50%; }
  .transition-cloud.c3 { width: 230px; height: 230px; left: 0; top: 330px; border-radius: 50%; }
  .transition-circle { position: relative; z-index: 1; width: 600px; height: 600px; border-radius: 50%;
    background: #fff; border: 10px solid #dde6f6; display: flex; align-items: center; justify-content: center;

  .transition-text { max-width: 440px; text-align: center; font-size: 30px; line-height: 1.6; color: #3a4a66; }
  .transition-text b { color: #26324a; }
  .transition-badge { position: absolute; z-index: 2; right: 4px; bottom: 4px; width: 130px; height: 130px;
    border-radius: 50%; background: #4a74c4; box-shadow: 0 0 0 10px #eef3fc;
    display: flex; align-items: center; justify-content: center; }
  .transition-badge svg { width: 56px; height: 56px; }
  .slide-wrap { position: absolute; inset: 0; }
  .slide-img { position: absolute; display: block; border-radius: 14px; box-shadow: 0 6px 24px rgba(30,50,100,.15); }
  .slide-hitbox { position: absolute; background: transparent; border: none; padding: 0; cursor: pointer; }

  /* ── 지각조직 ── */
  .po-main { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 16px; }
  .po-panel { width: 430px; height: 316px; box-sizing: border-box; border: 2px solid #e1e6f2; border-radius: 18px;
    background: #f8f9fc; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .po-panel.right { background: #eef7fe; border-color: #3cc0f5; }
  .po-arrow { color: #2554c7; font-weight: 800; font-size: 30px; }
  .po-stim { width: 210px; height: 210px; flex: 0 0 auto; }
  .po-stim.rot { transform: rotate(45deg); }
  .po-grid { display: grid; width: 250px; height: 250px; background: #f1f2f6; border: 1px solid #d5dae6; box-sizing: border-box; }
  .po-cell { border: 1px solid #d5dae6; box-sizing: border-box; position: relative; cursor: pointer; touch-action: manipulation; }
  .po-cell svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .po-cell.sel { background: #fbd9d9; outline: 4px solid #e53935; outline-offset: -4px; z-index: 2; }
  .po-cell.filled.sel { background: transparent; }
  .po-tray { display: flex; justify-content: space-around; align-items: center; background: #f8f9fc;
    border: 1px solid #e1e6f2; border-radius: 18px; padding: 16px 26px; margin-bottom: 16px; }
  .po-blk { width: 92px; height: 92px; box-sizing: border-box; background: #fff; border: 2px solid #d3d9e8;
    border-radius: 8px; padding: 0; cursor: pointer; position: relative; touch-action: manipulation; }
  .po-blk svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .po-blk.sel { outline: 5px solid #e53935; outline-offset: 2px; }
  .po-btns { display: flex; justify-content: center; gap: 26px; }

  /* ── 지각운동 ── */
  .mo-legend-wrap { position: relative; width: 560px; margin: 22px auto 0; }
  .mo-legend-label { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); background: #dde7f7;
    color: #2b4a8b; font-weight: 700; font-size: 18px; padding: 3px 28px; border-radius: 8px; }
  .mo-legend { display: flex; justify-content: center; gap: 6px; border: 3px solid #c3d6ee; border-radius: 14px;
    padding: 22px 14px 14px; background: #fff; }
  .mo-pair { width: 52px; border: 1.5px solid #cfd8ea; border-radius: 7px; overflow: hidden; text-align: center; background: #fff; }
  .mo-pair .sym { height: 46px; background: #eef4fe; display: flex; align-items: center; justify-content: center; }
  .mo-pair .sym img, .mo-q .sym img { display: block; height: 30px; width: 30px; }
  .mo-pair .dg { height: 36px; line-height: 36px; font-weight: 800; color: #2563eb; font-size: 22px; background: #f7f8fb; }
  .mo-hr { height: 1px; background: #d9dde8; margin: 40px auto 95px; width: 92%; }
  .mo-rows { display: flex; flex-direction: column; gap: 18px; align-items: center; min-height: 190px; }
  .mo-row { display: flex; gap: 8px; }
  .mo-row.empty { visibility: hidden; }
  .mo-q { width: 70px; border: 1.5px solid #d3d9e6; border-radius: 8px; overflow: hidden; text-align: center; background: #fff; box-sizing: border-box; }
  .mo-q .sym { height: 62px; display: flex; align-items: center; justify-content: center; }
  .mo-q .sym img { height: 36px; width: 36px; }
  .mo-q .ans { height: 54px; line-height: 54px; font-size: 28px; font-weight: 800; color: #2554c7; border-top: 1.5px solid #e1e6f2; background: #fafbfe; }
  .mo-q.active { outline: 4px solid #e53935; outline-offset: 1px; }
  .mo-qrow-hl { outline: 4px solid #e53935; outline-offset: 4px; border-radius: 10px; }
  .mo-keypad { display: flex; justify-content: center; gap: 9px; border: 1.5px solid #dde2ee; border-radius: 12px;
    background: #f6f7fa; padding: 14px 18px; width: fit-content; margin: 48px auto 0; }
  .mo-key { width: 70px; height: 64px; font-size: 30px; font-weight: 600; font-family: inherit; border: 2px solid #cfd6e6;
    border-radius: 10px; background: #fff; color: #444; cursor: pointer; touch-action: manipulation; }
  .mo-key:active { background: #dce8fb; }
  .mo-key.flash { background: #fdecea; border-color: #e53935; }

  /* ── 논리추론 ── */
  .lg-stage { position: relative; }
  .lg-label { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-weight: 800; font-size: 26px; color: #1f2430; }
  .lg-stimbox { position: relative; height: 410px; display: flex; align-items: center; justify-content: center; }
  .lg-stim { position: relative; width: 660px; border: 5px solid #99a9cc; box-sizing: content-box; background: #fff; }
  .lg-stim img { display: block; width: 100%; }
  .lg-blank { position: absolute; box-sizing: border-box; }
  .lg-blank.pink { background: rgba(240,150,150,.55); border: 3px solid #e53935; }
  .lg-blank.line { border: 3px solid #e53935; }
  .lg-opts { display: grid; grid-template-columns: repeat(3, 250px); gap: 26px 40px; justify-content: center; margin-top: 18px; }
  .lg-opt { border: 4px solid #99a9cc; background-color: #fff; background-repeat: no-repeat; background-size: 300% 200%;
    cursor: pointer; padding: 0; box-sizing: content-box; width: 250px; }
  .lg-opt:hover { border-color: #5f78b8; }
  .lg-opt.sel { border-color: #2554c7; box-shadow: 0 0 0 4px #bcd0f7; }
  .lg-opt.hl { border-color: #e53935; border-width: 5px; }
  .lg-opt.sel.hl { box-shadow: 0 0 0 4px #bcd0f7; }
  .lg-res-row { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
  .lg-res-stim { flex: 0 0 236px; border: 3px solid #cfd6e6; border-radius: 28px; overflow: hidden; background: #fff; }
  .lg-res-stim img { display: block; width: 100%; }
  .lg-res-opt { flex: 1 1 0; border: 2px solid #dfe3ee; border-radius: 10px; background-color: #fff;
    background-repeat: no-repeat; background-size: 300% 200%; }
  .lg-res-opt.chosen { border-color: #8fcfc4; box-shadow: inset 0 0 0 100px rgba(143,207,196,.55); }
</style>
</head>
<body></body>
<script>

const { ParameterType } = jsPsychModule;

// ── 고정 프레임(1100×950)을 창 크기만 기준으로 한 번 계산한 scale값으로 일괄 축소 ──
const FRAME_W = 1300, FRAME_H = 950;
let currentScale = 1;
function computeScale() {
  const margin = 12;
  currentScale = Math.min((window.innerWidth - margin * 2) / FRAME_W, (window.innerHeight - margin * 2) / FRAME_H);
  applyScale();
}
function applyScale() {
  const wrap = document.querySelector(".math-wrap");
  if (!wrap) return;
  wrap.style.transform = `scale(${currentScale})`;
}
new MutationObserver(() => applyScale()).observe(document.body, { childList: true, subtree: true });
window.addEventListener("resize", computeScale);
computeScale();

// ── 공통 설정 ──
const WARN_SEC = 5;            // 남은 시간 5초부터 카운트다운 표시
const USE_STOP_RULE = true;    // 중지 규칙(5문항 연속 0점 시 중지)을 쓰지 않으려면 false
const STOP_AFTER = 5;

function randomID(len = 10) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
const subjectId = (localStorage.getItem("vit_participant_code") || "").trim() || randomID(10);

function csvEscape(value) {
  if (value === undefined || value === null) return "";
  const s = String(value);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCSV(columns, rows) {
  const lines = [columns.join(",")];
  rows.forEach((r) => lines.push(columns.map((c) => csvEscape(r[c])).join(",")));
  return lines.join("\n");
}
// DataPipe 업로드가 실패했을 때 브라우저 콘솔에서 downloadFilteredCSV() 로 수동 백업을 받을 수 있습니다.
function downloadFilteredCSV() {
  const blob = new Blob([buildFilteredCSVString()], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${TEST_ID}_data_${CFG.lang}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 타이틀 이미지를 화면에 꽉 채우되, 글씨/버튼이 있는 "안전 영역"(data-safe-x)은 잘리지 않도록 배치
function layoutCoverHitboxes(container) {
  const img = container.querySelector(".slide-img");
  if (!img) return;
  const iw = Number(img.dataset.iw) || img.naturalWidth;
  const ih = Number(img.dataset.ih) || img.naturalHeight;
  if (!iw || !ih) return;
  const rect = container.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  // 실제 검사 화면(고정 프레임)과 비슷한 크기로 가운데에 배치 (프레임의 약 85%)
  const s0 = Math.min((W - 24) / FRAME_W, (H - 24) / FRAME_H);
  const boxW = FRAME_W * s0 * 0.85, boxH = FRAME_H * s0 * 0.85;
  const scale = Math.min(boxW / iw, boxH / ih);
  const dispW = iw * scale, dispH = ih * scale;
  const offX = (W - dispW) / 2, offY = (H - dispH) / 2;
  img.style.left = offX + "px"; img.style.top = offY + "px";
  img.style.width = dispW + "px"; img.style.height = dispH + "px";
  container.querySelectorAll(".slide-hitbox").forEach((btn) => {
    btn.style.left = offX + Number(btn.dataset.px) * scale + "px";
    btn.style.top = offY + Number(btn.dataset.py) * scale + "px";
    btn.style.width = Number(btn.dataset.pw) * scale + "px";
    btn.style.height = Number(btn.dataset.ph) * scale + "px";
  });
}

// ── "검사하기/시작하기"를 누른 직후 3초씩 보여주는 전환(로딩) 화면 ──
function transitionScreen(lines) {
  return `
    <div class="math-wrap transition-wrap">
      <div class="transition-stage">
        <div class="transition-cloud c1"></div>
        <div class="transition-cloud c2"></div>
        <div class="transition-cloud c3"></div>
        <div class="transition-circle">
          <div class="transition-text">${lines.join("<br>")}</div>
        </div>
        <div class="transition-badge">
          <svg viewBox="0 0 24 24">
            <polygon points="12,3 22,20 2,20" fill="#fff"/>
            <rect x="11" y="9" width="2" height="6" fill="#4a74c4"/>
            <circle cx="12" cy="17" r="1.2" fill="#4a74c4"/>
          </svg>
        </div>
      </div>
    </div>`;
}

// ── 지시문/안내 화면용 범용 플러그인 ──
// after_render(display_element) 가 함수를 돌려주면 화면을 떠날 때 그 함수를 호출합니다(예시 화면 연출 정리용).
class InfoScreenPlugin {
  static info = {
    name: "info-screen",
    version: "2.0.0",
    parameters: {
      tag: { type: ParameterType.STRING, default: "" },
      header_right: { type: ParameterType.HTML_STRING, default: "" },
      body_html: { type: ParameterType.HTML_STRING, default: "" },
      mockup_html: { type: ParameterType.HTML_STRING, default: "" },
      buttons: { type: ParameterType.STRING, array: true, default: ["→"] },
      use_arrow_nav: { type: ParameterType.BOOL, default: false },
      hero: { type: ParameterType.BOOL, default: false },
      after_render: { type: ParameterType.FUNCTION, default: null },
    },
    data: { response: { type: ParameterType.STRING } },
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(display_element, trial) {
    let cleanup = null;
    const done = (label) => { if (cleanup) cleanup(); this.jsPsych.finishTrial({ response: label }); };
    if (trial.hero) {
      display_element.innerHTML = `<div class="title-full">${trial.body_html}</div>`;
      const container = display_element.querySelector(".title-full");
      const img = container.querySelector(".slide-img");
      const relayout = () => layoutCoverHitboxes(container);
      if (img) { if (img.complete && img.naturalWidth) relayout(); else img.addEventListener("load", relayout); }
      window.addEventListener("resize", relayout);
      display_element.querySelectorAll("[data-i]").forEach((btn) => {
        btn.addEventListener("click", () => { window.removeEventListener("resize", relayout); done(trial.buttons[btn.dataset.i]); });
      });
      return;
    }
    const multi = trial.buttons.length > 1;
    const btnsHtml = trial.buttons.map((label, i) =>
      `<button class="next-btn ${multi && i === 0 ? "secondary-btn" : ""}" data-i="${i}">${label}</button>`).join("");
    const bodyAndNav = trial.use_arrow_nav && !multi
      ? `<div style="position:relative;">${trial.mockup_html || ""}
           <button class="nav-arrow-btn" data-i="0" aria-label="${trial.buttons[0]}"
             style="position:absolute; top:50%; right:-56px; transform:translateY(-50%);">→</button></div>`
      : `${trial.mockup_html || ""}<div class="btn-row">${btnsHtml}</div>`;
    display_element.innerHTML = `
      <div class="math-wrap"><div class="content-col">
        ${trial.tag ? `<div class="math-header"><div class="math-tag">${trial.tag}</div><div class="header-right">${trial.header_right || ""}</div></div>` : ""}
        ${trial.body_html}${bodyAndNav}
      </div></div>`;
    if (trial.after_render) cleanup = trial.after_render(display_element);
    display_element.querySelectorAll("[data-i]").forEach((btn) => {
      btn.addEventListener("click", () => done(trial.buttons[btn.dataset.i]));
    });
  }
}

function heroTrial(imgSrc) {
  return {
    type: InfoScreenPlugin, hero: true, buttons: [CFG.startBtn],
    body_html: `
      <div class="slide-wrap">
        <img class="slide-img" src="${imgSrc}" alt="${CFG.tag}"
          data-iw="${CFG.title.iw}" data-ih="${CFG.title.ih}" data-safe-x="${CFG.title.safeX}" />
        <button class="slide-hitbox" data-i="0" aria-label="${CFG.startBtn}"
          data-px="${CFG.title.px}" data-py="${CFG.title.py}" data-pw="${CFG.title.pw}" data-ph="${CFG.title.ph}"></button>
      </div>`,
  };
}

// 단계별 연출(예시 화면에서 상태가 바뀌는 애니메이션): states 를 interval 간격으로 반복 적용
function loopStates(root, selector, states, apply, interval = 900) {
  const el = root.querySelector(selector);
  if (!el) return null;
  let i = 0;
  const step = () => { apply(el, states[i % states.length]); i++; };
  step();
  const id = setInterval(step, interval);
  return () => clearInterval(id);
}

function makeJsPsych(testId) {
  return initJsPsych({
    extensions: [{
      type: jsPsychExtensionPipe,
      params: {
        experiment_id: "kWfRmZqO824v",
        // 다른 검사 결과와 파일이 섞이지 않도록 검사·언어를 파일명에 넣습니다.
        filename: () => VIT.fileName(subjectId),
        data_string: buildFilteredCSVString,
      },
    }],
    on_finish: () => VIT.finish(),
  });
}

function endScreen() {
  return { type: jsPsychHtmlKeyboardResponse, stimulus: VIT.endStimulus(CFG.endHtml), choices: [" "], trial_duration: VIT.endDuration() };
}

const TEST_ID = "motor";
const PER_ROW = 10;
const LIMIT_MS = 120000;                 // 본 검사 총 제한 시간 2분
const TEST = CFG.matrix.flat();                    // 본 문항 150개 (10개씩 15줄)
const G = CFG.glyphs;
const sym = (d) => `<img src="${G[d]}" alt="" draggable="false">`;

// 보기 칸(기호-숫자 9쌍)
function legendHTML(hl = []) {
  const h = (k) => (hl.includes(k) ? "highlight" : "");
  const pairs = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) =>
    `<div class="mo-pair ${h("pair" + d)}"><div class="sym">${sym(d)}</div><div class="dg">${d}</div></div>`).join("");
  return `<div class="mo-legend-wrap ${h("legend")}"><div class="mo-legend-label">${CFG.legendLabel}</div>
    <div class="mo-legend ${h("legendbox")}">${pairs}</div></div>`;
}
// 문제 칸 한 줄: digits = 이 줄의 정답 숫자(기호로 표시), answers = 입력된 숫자, active = 현재 칸
function rowHTML(digits, answers, active, hl = [], rowKey = "") {
  if (!digits) return `<div class="mo-row empty"><div class="mo-q"><div class="sym"></div><div class="ans"></div></div></div>`;
  const h = (k) => (hl.includes(k) ? "highlight" : "");
  const cells = digits.map((d, i) =>
    `<div class="mo-q ${active === i ? "active" : ""} ${h(rowKey + "c" + i)}">
       <div class="sym ${h(rowKey + "s" + i)}">${sym(d)}</div><div class="ans ${h(rowKey + "a" + i)}">${answers && answers[i] ? answers[i] : ""}</div></div>`).join("");
  return `<div class="mo-row ${hl.includes(rowKey + "all") ? "mo-qrow-hl" : ""} ${hl.includes(rowKey + "sym") ? "" : ""}">${cells}</div>`;
}
function keypadHTML(hl = [], pressed = 0) {
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) =>
    `<button class="mo-key ${hl.includes("key" + d) ? "highlight" : ""} ${pressed === d ? "btn-pressed" : ""}" data-key="${d}">${d}</button>`).join("");
  return `<div class="mo-keypad ${hl.includes("keypad") ? "highlight" : ""}">${keys}</div>`;
}
function screenHTML({ rows, answers = [[], []], active = -1, hl = [], pressed = 0 }) {
  return `${legendHTML(hl)}<div class="mo-hr"></div>
    <div class="mo-rows">${rowHTML(rows[0], answers[0], active, hl, "r0")}${rowHTML(rows[1], answers[1], -1, hl, "r1")}</div>
    ${keypadHTML(hl, pressed)}`;
}
const EXR = [CFG.matrix[0], CFG.matrix[1]];
function mock(over = {}) {
  return `<div class="mo-screen mockup-inert">${screenHTML(Object.assign({ rows: EXR }, over))}</div>`;
}
function pressAnim() {
  return (root) => loopStates(root, ".mo-screen", [0, 1], (el, s) => {
    el.innerHTML = screenHTML({ rows: EXR, active: 0, hl: ["pair1", "r0c0", "key1"], answers: [s ? [1] : [], []], pressed: s ? 1 : 0 });
  }, 1300);
}

// ── 문항 블록 플러그인: 한 블록(예시 20개 / 본 150개)을 한 번에 진행합니다 ──
// 한 줄(10개)이 모두 채워지면 둘째 줄이 위로 올라오고 그 아래에 다음 줄이 나타납니다(노래방 가사 방식).
class MotorBlockPlugin {
  static info = {
    name: "motor-block", version: "1.0.0",
    parameters: {
      digits: { type: ParameterType.COMPLEX, default: undefined },
      phase: { type: ParameterType.STRING, default: "test" },
      limit_ms: { type: ParameterType.INT, default: 0 },
    },
    data: { results: { type: ParameterType.COMPLEX }, completion_time: { type: ParameterType.INT }, finished_all: { type: ParameterType.BOOL } },
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(display_element, trial) {
    const digits = trial.digits, total = digits.length;
    const results = [];
    let i = 0, finished = false, timeoutId = null;
    const answersByRow = {};
    display_element.innerHTML = `
      <div class="math-wrap"><div class="content-col">
        <div class="math-header"><div class="math-tag">${CFG.tag}</div></div>
        <div id="mo-root"></div>
      </div></div>`;
    const root = display_element.querySelector("#mo-root");
    const rowOf = (k) => Math.floor(k / PER_ROW);
    const rowDigits = (r) => (r * PER_ROW < total ? digits.slice(r * PER_ROW, (r + 1) * PER_ROW) : null);
    const paint = (flashKey = 0) => {
      const r = rowOf(i);
      const ans = (rr) => (answersByRow[rr] || []);
      root.innerHTML = screenHTML({
        rows: [rowDigits(r), rowDigits(r + 1)], answers: [ans(r), ans(r + 1)], active: i % PER_ROW,
      });
      if (flashKey) { const b = root.querySelector(`[data-key="${flashKey}"]`); if (b) { b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 300); } }
    };
    const clickKey = (d) => press(d);
    root.addEventListener("click", (e) => { const b = e.target.closest("[data-key]"); if (b) clickKey(Number(b.dataset.key)); });
    const onKey = (e) => { const d = /^[1-9]$/.test(e.key) ? Number(e.key) : 0; if (d) press(d); };
    document.addEventListener("keydown", onKey);

    const t0 = performance.now();
    let onset = t0;
    const press = (d) => {
      if (finished) return;
      const now = performance.now();
      const ans = digits[i];
      results.push({ idx: i + 1, row: rowOf(i) + 1, col: (i % PER_ROW) + 1, answer: ans, response: d,
        correct: d === ans, rt: Math.round(now - onset), elapsed: Math.round(now - t0) });
      (answersByRow[rowOf(i)] = answersByRow[rowOf(i)] || [])[i % PER_ROW] = d;
      i++; onset = now;
      if (i >= total) return end(false);
      paint();
    };
    paint();
    if (trial.limit_ms > 0) timeoutId = setTimeout(() => end(true), trial.limit_ms);

    const end = (timedOut) => {
      if (finished) return;
      finished = true; clearTimeout(timeoutId); document.removeEventListener("keydown", onKey);
      const last = results.length ? results[results.length - 1].elapsed : 0;
      // 검사 완료 시간: 모든 문항을 푼 경우 첫 자극부터 마지막 반응까지, 못 푼 경우 제한 시간(2분)
      const completion = timedOut ? trial.limit_ms : last;
      this.jsPsych.finishTrial({ results, completion_time: completion, finished_all: !timedOut });
    };
  }
}

const CSV_COLUMNS = [
  "code_name", "language", "item_index", "row", "col", "correct_answer", "response", "correct", "false_alarm", "score",
  "rt", "elapsed_time", "completion_time", "administered",
];
function buildFilteredCSVString() {
  const blk = jsPsych.data.get().filter({ phase: "motor_test" }).values()[0];
  const res = blk ? blk.results : [];
  const comp = blk ? blk.completion_time : "";
  const byIdx = {};
  res.forEach((r) => { byIdx[r.idx] = r; });
  const rows = TEST.map((d, k) => {
    const idx = k + 1, r = byIdx[idx];
    const base = { language: CFG.lang, item_index: idx, row: Math.floor(k / PER_ROW) + 1, col: (k % PER_ROW) + 1,
      correct_answer: d, completion_time: comp };
    return r ? { ...base, response: r.response, correct: r.correct, false_alarm: !r.correct, score: r.correct ? 1 : 0,
        rt: r.rt, elapsed_time: r.elapsed, administered: true }
             : { ...base, administered: false };
  });
  rows.forEach((r) => { r.code_name = subjectId; });
  return toCSV(CSV_COLUMNS, rows);
}

];
// 줄 전체를 감싸는 빨간 테두리가 필요한 화면(기호 줄/숫자 줄)은 렌더 뒤에 DOM 으로 입힙니다.
function decorate(root, kind) {
  const outline = (els) => {
    const a = els[0].getBoundingClientRect(), b = els[els.length - 1].getBoundingClientRect();
    const host = root.querySelector(".mo-screen"); host.style.position = "relative";
    const hr = host.getBoundingClientRect();
    const sc = hr.width / host.offsetWidth || 1;
    const d = document.createElement("div");
    // box-sizing:border-box를 명시해야 border 두께만큼 박스가 더 커지지 않고, 여유 공간도
    // 더 넓히고(10px) 펄스 애니메이션 클래스를 줘서 눈에 더 잘 띄게 합니다.
    d.className = "mo-decor-hl";
    d.style.cssText = `position:absolute;box-sizing:border-box;border:4px solid #e53935;border-radius:8px;pointer-events:none;
      left:${(a.left - hr.left) / sc - 10}px;top:${(a.top - hr.top) / sc - 10}px;
      width:${(b.right - a.left) / sc + 20}px;height:${(b.bottom - a.top) / sc + 20}px;`;
    host.appendChild(d);
  };
  const q = (s) => Array.from(root.querySelectorAll(s));
  if (kind === "syms") outline(q(".mo-pair .sym"));
  if (kind === "digits") outline(q(".mo-pair .dg"));
  if (kind === "qsyms") outline(q(".mo-rows .mo-row:first-child .mo-q .sym"));
  if (kind === "qans") outline(q(".mo-rows .mo-row:first-child .mo-q .ans"));
}
const instructionBlock = screens.map((s) => ({
