<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Tính toán số học - Demo</title>
<script src="https://unpkg.com/jspsych@8.3.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
<script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
<script src="../../assets/flow.js"></script>
<link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
<style>
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  /* 줄바꿈 시 '~하'/'고'처럼 단어/음절 중간이 잘리지 않도록 — 한글은 음절 단위로
     줄바꿈이 가능한 게 기본값이라 keep-all로 막고, 베트남어(라틴 문자+공백)에도
     동일하게 적용해 단어 중간이 아니라 항상 공백에서만 줄이 바뀌도록 통일합니다. */
  body { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; background: #f4f6fb;
    display: flex; align-items: center; justify-content: center;
    word-break: keep-all; overflow-wrap: normal; }
  /* jsPsych이 자체적으로 만드는 래퍼(#jspsych-content-wrapper 등)에도
     기본 overflow:auto 스타일이 있어서, 이것 때문에 스크롤바가 생길 수 있어 강제로 막습니다. */
  #jspsych-content-wrapper, .jspsych-display-element, #jspsych-content {
    height: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important;
    overflow: hidden !important; display: flex !important; align-items: center !important;
    justify-content: center !important;
  }
  /* 고정 크기 슬라이드 프레임 — 내용과 무관하게 항상 같은 크기로 그린 뒤,
     창 크기에 맞춰 이 프레임 전체를 통째로 한 번만 scale합니다.
     (화면마다 내용 길이가 달라 매번 다르게 줄어드는 문제를 막기 위함) */
  .math-wrap { width: 1340px; height: 950px; box-sizing: border-box; margin: 0;
    padding: 50px 80px; display: flex; flex-direction: column; justify-content: center;  /* 화면마다 높이가 달라도 제목·지시문 위치가 흔들리지 않도록 위쪽 기준 정렬 */
    overflow: hidden; transform-origin: center center; flex-shrink: 0; }
  /* 모든 화면(타이틀/지시문/문항/닫기/경고)이 항상 같은 폭·같은 위치를 쓰도록 고정하는 컬럼.
     화면마다 카드 크기가 달라져 위치가 들쭉날쭉해지는 것을 막습니다. */
  .content-col { width: 1000px; margin: 0 auto; }

  /* 상단 헤더: 소검사명 태그 + 문항 진행도 */
  .math-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .math-tag { font-weight: 700; font-size: 31px; color: #1c3f94; border-left: 6px solid #2554c7;
    padding-left: 16px; }
  /* 응답 제한 30초 중 5초 남았을 때 보이는 카운트다운 — 비고란 "5초 남았을 때 카운팅다운으로 시간 촉구" 반영 */
  .math-progress-wrap { display: flex; align-items: center; gap: 12px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .timer-badge { visibility: hidden; background: #fdecea; color: #c62828; border: 2px solid #f3c6c2;
    font-weight: 700; font-size: 20px; padding: 8px 20px; border-radius: 24px; min-width: 64px; text-align: center; }
  .timer-badge.on { visibility: visible; animation: timer-pulse 1s ease-in-out infinite; }
  @keyframes timer-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .math-progress { background: #2554c7; color: #fff; font-weight: 600; font-size: 20px;
    padding: 12px 26px; border-radius: 26px; }

  /* 문제만 보여주는 카드 (5초) */
  .question-card { text-wrap: balance; background: #fafbfe; border: 1px solid #e1e6f2; border-radius: 20px;
    padding: 70px 50px; min-height: 260px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 34px; font-weight: 600; color: #2b2b2b; line-height: 1.7; }

  /* 응답 단계를 감싸는 바깥 카드 */
  .response-card { background: #fff; border: 2px solid #2554c7; border-radius: 20px; padding: 18px; }

  /* Xem lại | 입력값 | Nhập lại 한 줄 */
  .control-row { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .side-btn { flex: 0 0 auto; padding: 17px 26px; border-radius: 14px; border: 1px solid #b9c7ea;
    background: #eaf0fd; color: #1c3f94; font-weight: 600; font-size: 22px; cursor: pointer; }
  .side-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .answer-box { flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between;
    border: 2px solid #2554c7; border-radius: 12px; padding: 14px 22px; }
  .answer-box .label { font-size: 18px; color: #7a86a3; }
  .answer-box .value { font-size: 32px; font-weight: 700; color: #1c3f94; min-width: 50px; text-align: right; }

  /* 숫자 키패드 0~9 + 지우기(backspace, 한 글자씩 삭제) —
     1~9 아홉 칸 다음에 네 번째 줄로 [빈칸, 0, 지우기] 세 칸을 추가해서
     grid-template-columns: repeat(3,1fr) 그대로 12칸(4행×3열)을 채웁니다.
     한 줄이 늘어난 만큼 버튼 세로 여백을 줄여서 고정 프레임(.math-wrap, 950px
     높이) 안에 다시 들어맞도록 맞췄습니다. */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
  .keypad button { font-size: 28px; font-weight: 600; padding: 16px 0; border-radius: 14px;
    border: 1px solid #dfe4ee; background: #f7f8fc; color: #333; cursor: pointer; }
  .keypad button:hover { background: #eef1fa; }
  .keypad button.keypad-blank { visibility: hidden; pointer-events: none; }
  .keypad button.keypad-backspace { background: #fdecea; color: #c62828; border-color: #f3c6c2;
    font-size: 28px; }
  .keypad button.keypad-backspace:hover { background: #fbdedb; }

  .next-btn { display: block; width: 100%; font-size: 31px; font-weight: 700; padding: 18px 0;
    border-radius: 14px; border: none; background: #2554c7; color: white; cursor: pointer; }
  .next-btn:hover { background: #1c3f94; }
  .next-btn:disabled { background: #b9c7ea; cursor: not-allowed; }

  .mask { width: 100%; height: 320px; }

  /* ── 안내/지시문 화면 전용 ── */
  /* text-wrap: balance — 다른 소검사들과 동일하게, 줄바꿈이 필요할 때 마지막 줄만
     짧게 남는(orphan) 것을 브라우저가 자동으로 균형 있게 배분하도록 통일 */
  .info-box { background: #fafbfe; border: 1px solid #e1e6f2; border-radius: 16px;
    padding: 18px 28px; font-size: 27px; line-height: 1.6; color: #2b2b2b; margin-bottom: 14px;
    text-wrap: balance; min-height: 101px; box-sizing: border-box; text-wrap: balance; word-break: keep-all; }
  .info-box b { font-weight: 800; }
  .badge { display: inline-block; background: #eaf0fd; color: #1c3f94; font-weight: 700;
    font-size: 20px; padding: 10px 22px; border-radius: 20px; border: 1px solid #c7d4f5; margin-bottom: 18px; }
  .highlight { outline: 4px solid #e53935; outline-offset: 3px; }
  .keypad button.selected { background: #b9c7ea; }
  .mockup-inert { pointer-events: none; }
  .mockup-inert button:disabled { cursor: default; }
  .btn-row { text-align: center; margin-top: 20px; }
  .btn-row .next-btn { display: inline-block; width: auto; min-width: 260px; margin: 0 10px; padding: 18px 40px; white-space: nowrap; border-radius: 40px; }
  .btn-row .secondary-btn { background: #fff; color: #2554c7; border: 2px solid #2554c7; }
  .btn-row .secondary-btn:hover { background: #eaf0fd; }
  .warn-card { max-width: 640px; margin: 0 auto; text-align: center; background: #fff;
    border-radius: 50% / 30%; padding: 80px 50px; box-shadow: 0 0 0 1px #e1e6f2 inset; }
  .warn-card p { font-size: 26px; line-height: 1.7; color: #33425c; margin-bottom: 30px; }

  /* 지시문 화면의 미리보기(mockup) 요소는 완전히 비활성 — 클릭/호버 반응 없음 */
  button:disabled { pointer-events: none !important; cursor: default !important; }

  /* 지시문(튜토리얼) 화면을 넘기는 실제 버튼 — 카드 안의 설명용(가짜) Tiếp theo 버튼과
     헷갈리지 않도록 완전히 다른 모양(원형 화살표)으로, 카드 바깥 옆에 둡니다. */
  .nav-arrow-btn { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; border: none;
    background: #2554c7; color: #fff; font-size: 32px; line-height: 1; cursor: pointer;
    box-shadow: 0 10px 24px rgba(37,84,199,0.35); display: flex; align-items: center; justify-content: center; }
  .nav-arrow-btn:hover { background: #1c3f94; }

  /* 카드 안 숫자가 눌리는 것처럼 보이는 애니메이션 */
  .keypad button.key-press { background: #9fb3e6 !important; transform: scale(0.93);
    transition: transform .12s ease, background .12s ease; }
  .answer-box .value { transition: opacity .15s ease; }

  /* 카드 안의 Tiếp theo/Xem lại/Nhập lại 버튼이 "눌리는" 것처럼 보이는 애니메이션 */
  .btn-pressed { transform: scale(0.95); filter: brightness(0.9);
    transition: transform .12s ease, filter .12s ease; }

  /* ── 타이틀 화면: 원본 PPT 슬라이드를 고해상도로 그대로 캡처한 이미지 한 장을
     씁니다. 원래 원본 디자인은 배경 원이 슬라이드 왼쪽 경계에서 잘려 있었는데,
     그 원의 실제 곡선을 그대로 분석해서(피팅) 캔버스를 왼쪽/위/아래로 넓히고
     같은 색으로 이어 그려서 이미지 자체가 "완전히 잘리지 않는 원"이 되도록
     미리 보정해 놓은 파일이 images/title-slide.png 입니다.
     창 전체(100vw/100vh)를 이미지로 빈틈없이 꽉 채웁니다(object-fit: cover —
     화면 비율에 따라 이미지 일부가 살짝 잘릴 수는 있지만 흰 여백/레터박스는
     절대 생기지 않습니다). "Bắt đầu" 버튼 자리는 더 이상 고정 퍼센트가 아니라,
     이미지 원본 픽셀 좌표(data-px/py/pw/ph)를 기준으로 실제 화면에 그려지는
     cover 크롭/스케일을 매 순간 계산해서 자바스크립트로 위치를 맞춥니다
     (아래 layoutCoverHitboxes 함수, resize 시에도 재계산). */
  .title-full { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #f4f6fb;
    overflow: hidden; }
  .slide-wrap { position: absolute; inset: 0; }
  .slide-img { position: absolute; display: block; border-radius: 14px; box-shadow: 0 6px 24px rgba(30,50,100,.15); }

  /* ── "Bắt đầu kiểm tra" 버튼을 누른 직후 바로 첫 문제로 넘어가지 않고 2초씩
     보여주는 전환(로딩) 화면 — 요청하신 참고 이미지(흰 원 + 구름 모양 장식 +
     우측 하단 느낌표 배지)를 그대로 재현한 디자인입니다. .math-wrap 클래스를
     그대로 써서 기존 scale 시스템(1100×950 프레임)에 자동으로 맞춰집니다. */
  .transition-stage { position: relative; width: 760px; height: 760px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center; }
  .transition-cloud { position: absolute; background: #aebfe6; z-index: 0; }
  .transition-cloud.c1 { width: 230px; height: 200px; top: 30px; right: 60px;
    border-radius: 55% 45% 50% 50% / 60% 55% 45% 40%; }
  .transition-cloud.c2 { width: 120px; height: 120px; top: 190px; right: 0; border-radius: 50%; }
  .transition-cloud.c3 { width: 230px; height: 230px; left: 0; top: 330px; border-radius: 50%; }
  .transition-circle { position: relative; z-index: 1; width: 600px; height: 600px; border-radius: 50%;
    background: #fff; border: 10px solid #dde6f6; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px #eef2fb inset; }
  .transition-text { max-width: 440px; text-align: center; font-size: 30px; line-height: 1.6; color: #3a4a66; }
  .transition-text b { color: #26324a; }
  .transition-badge { position: absolute; z-index: 2; right: 4px; bottom: 4px; width: 130px; height: 130px;
    border-radius: 50%; background: #4a74c4; box-shadow: 0 0 0 10px #eef3fc;
    display: flex; align-items: center; justify-content: center; }
  .transition-badge svg { width: 56px; height: 56px; }
  .slide-hitbox { position: absolute; background: transparent; border: none; padding: 0;
    cursor: pointer; }
</style>
</head>
<body></body>
<script>

const { ParameterType } = jsPsychModule;

// ── 모든 화면이 항상 같은 비율로 보이도록, 고정 크기(.math-wrap: 1100×950)
//    프레임을 "창 크기"만 기준으로 한 번 계산한 scale값으로 일괄 축소합니다.
//    (화면마다 다시 측정해서 scale을 바꾸면 화면 전환 때마다 크기가 들쭉날쭉해짐 → 금지)
const FRAME_W = 1300;
const FRAME_H = 950;
let currentScale = 1;

function computeScale() {
  const margin = 16;
  currentScale = Math.min(
    (window.innerWidth - margin * 2) / FRAME_W,
    (window.innerHeight - margin * 2) / FRAME_H
  );
  applyScale();
}

function applyScale() {
  const wrap = document.querySelector(".math-wrap");
  if (!wrap) return;
  // 타이틀 화면(.slide-frame)은 100vw/100vh로 직접 꽉 채우는 방식이라
  // scale() 변환이 필요 없습니다(건드리면 오히려 어긋남).
  if (wrap.classList.contains("slide-frame")) return;
  wrap.style.transform = `scale(${currentScale})`;
}

const fitObserver = new MutationObserver(() => applyScale());
fitObserver.observe(document.body, { childList: true, subtree: true });
window.addEventListener("resize", computeScale);
computeScale();

// ── 수리계산(Tính toán số học) 실제 검사 15문항 (기획서 부록 1~15번 그대로) ──
// (키패드에 0도 있어서 여러 자리 숫자 정답도 입력 가능; 쉼표/단위는 답에서 제외)
const ITEMS = [
  { question: "Trong chuồng gà có 13 con gà. Có 5 con chạy ra ngoài.<br>Chuồng còn lại bao nhiêu con gà?", answer: "8" },
  { question: "Hà sưu tầm được 54 con tem tháng trước và 33 con tem tháng này.<br>Hà đã sưu tầm được tất cả bao nhiêu con tem trong hai tháng?", answer: "87" },
  { question: "Trong rổ có 83 quả xoài. Người bán đã bán đi 27 quả ở chợ.<br>Rổ còn lại bao nhiêu quả xoài?", answer: "56" },
  { question: "Trong dịp Tết, mỗi ngày có 6 vị khách đến thăm.<br>Sau 7 ngày, có tất cả bao nhiêu vị khách đến thăm?", answer: "42" },
  { question: "Long mua 9 túi bánh Trung Thu, mỗi túi có 4 cái bánh.<br>Long mua tất cả bao nhiêu cái bánh Trung Thu?", answer: "36" },
  { question: "Mỗi ngày, người ngư dân bắt được 24 kg tôm.<br>Sau 13 ngày, người ngư dân bắt được tất cả bao nhiêu kg tôm?", answer: "312" },
  { question: "Có 96 học sinh cần chia đều lên các xe buýt.<br>Nếu mỗi xe chở được 8 người, cần bao nhiêu xe buýt?", answer: "12" },
  { question: "Tàu hỏa từ TP. Hồ Chí Minh đến Hà Nội chạy với vận tốc 175 km/giờ.<br>Sau 4 giờ, tàu đi được tất cả bao nhiêu km?", answer: "700" },
  { question: "Thu hoạch được 952 kg thóc từ nông trại, chia đều cho các hộ dân trong làng.<br>Nếu mỗi hộ nhận 4 kg, có thể chia cho bao nhiêu hộ?", answer: "238" },
  { question: "Thư viện có 120 quyển sách. Buổi sáng cho mượn 45 quyển,<br>buổi chiều trả lại 38 quyển. Thư viện hiện có bao nhiêu quyển sách?", answer: "113" },
  { question: "Mỗi ngày, tiệm bánh nướng 215 ổ bánh mì baguette.<br>Sau 6 ngày, tiệm nướng được tất cả bao nhiêu ổ bánh mì?", answer: "1290" },
  { question: "Có 480 quả trứng cần xếp vào các hộp.<br>Mỗi hộp xếp 8 quả một hàng và xếp được 5 hàng.<br>Cần bao nhiêu hộp trứng?", answer: "12" },
  { question: "Tại chợ, một chiếc nón lá có giá gốc 80.000 đồng được giảm giá 20%.<br>Chiếc nón lá đó được bán với giá bao nhiêu đồng?", answer: "64000" },
  { question: "Một máy bơm có thể bơm được 90 lít nước trong 3 phút.<br>Muốn bơm được 420 lít, cần bao nhiêu phút?", answer: "14" },
  { question: "5 công nhân cần 18 ngày để hoàn thành một đơn hàng vải.<br>Nếu muốn hoàn thành trong 6 ngày, cần bao nhiêu công nhân?", answer: "15" },
];

// ── 지시문 화면에서 보여줄 응답카드 미리보기(mockup) ──
// Xem lại/입력창/Nhập lại/키패드/카드 안 "Tiếp theo"는 전부 완전히 비활성(클릭 불가) —
// 실제 검사 화면이 이렇게 생겼다는 것만 "보여주는" 용도입니다.
// animType으로 어떤 연출을 반복 재생할지 정합니다:
//   "type-digits"  : 키패드 숫자가 실제로 눌리는 것처럼 바뀜 (animateDigits 배열 사용)
//   "press-next"   : 카드 안 "Tiếp theo" 버튼만 주기적으로 눌리는 효과
//   "press-retype" : "Nhập lại" 버튼이 눌리면서 입력값이 사라졌다 돌아오는 효과
//   "press-again"  : "Xem lại" 버튼이 눌리면서 문제 화면이 잠깐 다시 보였다 사라지는 효과
// 화면을 실제로 넘기는 버튼은 이 카드 밖, 별도의 원형 화살표 버튼입니다.
function mockupCard({
  highlight = null, answerValue = "", selectedDigit = null,
  animateDigits = null, animType = null, animValue = "", animQuestion = "",
  button = "Tiếp theo →",
} = {}) {
  const hl = (name) => (highlight === name ? "highlight" : "");
  const initialVal = animateDigits ? "" : answerValue;
  const type = animateDigits ? "type-digits" : animType;
  const dataAttrs = type
    ? `data-anim-type="${type}" data-animate-digits="${(animateDigits || []).join(",")}"
       data-anim-value="${(animValue || "").replace(/"/g, "&quot;")}"
       data-anim-question="${(animQuestion || "").replace(/"/g, "&quot;")}"`
    : "";
  return `
    <div class="response-card" ${dataAttrs}>
      <div class="mockup-inert">
        <div class="control-row">
          <button class="side-btn ${hl("again")}" disabled>Xem lại</button>
          <div class="answer-box ${hl("answer")}">
            <span class="label">Đáp án đã nhập</span>
            <span class="value">${initialVal || "&nbsp;"}</span>
          </div>
          <button class="side-btn ${hl("retype")}" disabled>Nhập lại</button>
        </div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button disabled class="${String(selectedDigit) === String(n) ? "selected" : ""}">${n}</button>`).join("")}
          <button disabled class="keypad-blank" aria-hidden="true"></button>
          <button disabled class="${String(selectedDigit) === "0" ? "selected" : ""}">0</button>
          <button disabled class="keypad-backspace" aria-label="Xóa">⌫</button>
        </div>
        ${button ? `<button class="next-btn ${hl("next")}" disabled>${button}</button>` : ""}
      </div>
    </div>`;
}

// ── "Bắt đầu kiểm tra"를 누른 직후 2초씩 보여주는 전환(로딩) 화면 ──
// lines: 줄마다 따로 넣을 문자열 배열 (굵게 표시하고 싶은 부분은 <b>…</b>로 직접 감싸서 전달)
function transitionScreen(lines) {
  return `
    <div class="math-wrap transition-wrap">
      <div class="transition-stage">
        <div class="transition-cloud c1"></div>
        <div class="transition-cloud c2"></div>
        <div class="transition-cloud c3"></div>
        <div class="transition-circle">
          <div class="transition-text">${lines.join("<br>")}</div>
        </div>
        <div class="transition-badge">
          <svg viewBox="0 0 24 24">
            <polygon points="12,3 22,20 2,20" fill="#fff"/>
            <rect x="11" y="9" width="2" height="6" fill="#4a74c4"/>
            <circle cx="12" cy="17" r="1.2" fill="#4a74c4"/>
          </svg>
        </div>
      </div>
    </div>`;
}

// ── mockupCard의 data-anim-type에 따라 알맞은 연출을 반복 재생 ──
let mockupAnimTimer = null;
let mockupAnimTimeouts = [];

function clearMockupAnim() {
  if (mockupAnimTimer) { clearInterval(mockupAnimTimer); mockupAnimTimer = null; }
  mockupAnimTimeouts.forEach(clearTimeout);
  mockupAnimTimeouts = [];
}

function initMockupAnimation(root) {
  clearMockupAnim();
  const card = root.querySelector(".response-card[data-anim-type]");
  if (!card) return;
  const type = card.dataset.animType;

  if (type === "type-digits") {
    const seq = card.dataset.animateDigits.split(",").map((s) => s.trim()).filter(Boolean);
    if (!seq.length) return;
    const valueEl = card.querySelector(".value");
    const keypadBtns = Array.from(card.querySelectorAll(".keypad button"));
    let i = 0;
    let typed = "";
    const step = () => {
      const d = seq[i % seq.length];
      typed = seq.length === 1 ? d : typed.length >= 2 ? d : typed + d;
      valueEl.textContent = typed;
      keypadBtns.forEach((b) => b.classList.remove("selected", "key-press"));
      const btn = keypadBtns.find((b) => b.textContent.trim() === d);
      if (btn) {
        btn.classList.add("selected", "key-press");
        mockupAnimTimeouts.push(setTimeout(() => btn.classList.remove("key-press"), 180));
      }
      i++;
    };
    step();
    mockupAnimTimer = setInterval(step, 900);
    return;
  }

  if (type === "press-next") {
    const btn = card.querySelector(".next-btn");
    if (!btn) return;
    const press = () => {
      btn.classList.add("btn-pressed");
      mockupAnimTimeouts.push(setTimeout(() => btn.classList.remove("btn-pressed"), 220));
    };
    press();
    mockupAnimTimer = setInterval(press, 1500);
    return;
  }

  if (type === "press-retype") {
    const btn = card.querySelector(".side-btn.highlight");
    const valueEl = card.querySelector(".value");
    const original = card.dataset.animValue || "";
    if (!btn || !valueEl) return;
    let cleared = false;
    const step = () => {
      if (!cleared) {
        btn.classList.add("btn-pressed");
        mockupAnimTimeouts.push(setTimeout(() => {
          btn.classList.remove("btn-pressed");
          valueEl.innerHTML = "&nbsp;";
          cleared = true;
        }, 220));
      } else {
        valueEl.textContent = original;
        cleared = false;
      }
    };
    step();
    mockupAnimTimer = setInterval(step, 950);
    return;
  }

  if (type === "press-again") {
    const btn = card.querySelector(".side-btn.highlight");
    const questionHtml = card.dataset.animQuestion || "";
    const parent = card.parentElement;
    if (!btn || !parent) return;
    let showingQuestion = false;
    const step = () => {
      if (!showingQuestion) {
        btn.classList.add("btn-pressed");
        mockupAnimTimeouts.push(setTimeout(() => {
          btn.classList.remove("btn-pressed");
          card.style.visibility = "hidden";
          const q = document.createElement("div");
          q.className = "question-card anim-question-overlay";
          q.style.position = "absolute";
          q.style.inset = "0";
          q.innerHTML = questionHtml;
          parent.style.position = "relative";
          parent.appendChild(q);
          showingQuestion = true;
        }, 220));
      } else {
        const overlay = parent.querySelector(".anim-question-overlay");
        if (overlay) overlay.remove();
        card.style.visibility = "";
        showingQuestion = false;
      }
    };
    step();
    mockupAnimTimer = setInterval(step, 1200);
    return;
  }
}

// 화면을 이미지로 최대한 꽉 채우되(object-fit:cover와 같은 개념을 직접 계산),
// 글씨/버튼이 들어있는 "안전 영역"(data-safe-x)만큼은 아무리 화면이 좁고 길어도
// 절대 잘리지 않도록 스케일을 제한합니다. 그 스케일에 맞춰 이미지 자체와
// 버튼 히트박스(.slide-hitbox, data-px/py/pw/ph)를 둘 다 매번 다시 배치합니다.
// (보통 화면 비율에서는 일반 cover와 동일하게 빈틈없이 꽉 차고, 아주 좁고 긴
// 화면에서만 오른쪽에 약간의 흰 여백이 생기는 대신 글씨/버튼은 항상 보장됩니다)
function layoutCoverHitboxes(container) {
  const img = container.querySelector(".slide-img");
  if (!img) return;
  const iw = Number(img.dataset.iw) || img.naturalWidth;
  const ih = Number(img.dataset.ih) || img.naturalHeight;
  if (!iw || !ih) return;
  const rect = container.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  // 실제 검사 화면(고정 프레임)과 비슷한 크기로 가운데에 배치 (프레임의 약 85%)
  const s0 = Math.min((W - 24) / FRAME_W, (H - 24) / FRAME_H);
  const boxW = FRAME_W * s0 * 0.85, boxH = FRAME_H * s0 * 0.85;
  const scale = Math.min(boxW / iw, boxH / ih);
  const dispW = iw * scale, dispH = ih * scale;
  const offX = (W - dispW) / 2, offY = (H - dispH) / 2;
  img.style.left = offX + "px"; img.style.top = offY + "px";
  img.style.width = dispW + "px"; img.style.height = dispH + "px";
  container.querySelectorAll(".slide-hitbox").forEach((btn) => {
    btn.style.left = offX + Number(btn.dataset.px) * scale + "px";
    btn.style.top = offY + Number(btn.dataset.py) * scale + "px";
    btn.style.width = Number(btn.dataset.pw) * scale + "px";
    btn.style.height = Number(btn.dataset.ph) * scale + "px";
  });
}

// ── 지시문/안내 화면용 범용 플러그인 (버튼 클릭으로 다음으로 진행) ──
class InfoScreenPlugin {
  static info = {
    name: "info-screen",
    version: "1.0.0",
    parameters: {
      tag: { type: ParameterType.STRING, default: "Tính toán số học" },
      body_html: { type: ParameterType.HTML_STRING, default: "" },
      mockup_html: { type: ParameterType.HTML_STRING, default: "" },
      buttons: { type: ParameterType.STRING, array: true, default: ["Tiếp theo →"] },
      use_arrow_nav: { type: ParameterType.BOOL, default: false },
      hero: { type: ParameterType.BOOL, default: false },
    },
    data: { response: { type: ParameterType.STRING } },
  };

  constructor(jsPsych) { this.jsPsych = jsPsych; }

  trial(display_element, trial) {
    // 타이틀(첫) 화면 — 다른 화면들의 "고정 프레임 + scale()" 방식 대신
    // 창 전체(100vw/100vh)를 반응형으로 꽉 채우는 전용 레이아웃을 씁니다.
    // body_html 안에 배경원(.hero-circle)·텍스트·일러스트·버튼이 전부 들어있습니다.
    if (trial.hero) {
      display_element.innerHTML = `<div class="title-full">${trial.body_html}</div>`;
      const container = display_element.querySelector(".title-full");
      const img = container.querySelector(".slide-img");
      const relayout = () => layoutCoverHitboxes(container);
      if (img) {
        if (img.complete && img.naturalWidth) relayout();
        else img.addEventListener("load", relayout);
      }
      window.addEventListener("resize", relayout);
      display_element.querySelectorAll("[data-i]").forEach((btn) => {
        btn.addEventListener("click", () => {
          clearMockupAnim();
          window.removeEventListener("resize", relayout);
          this.jsPsych.finishTrial({ response: trial.buttons[btn.dataset.i] });
        });
      });
      return;
    }

    const multi = trial.buttons.length > 1;
    const btnsHtml = trial.buttons
      .map((label, i) => {
        const secondary = multi && i === 0 ? "secondary-btn" : "";
        return `<button class="next-btn ${secondary}" data-i="${i}">${label}</button>`;
      })
      .join("");

    // 단일 버튼 + mockup이 있는 지시문 화면: 카드 "옆"에 원형 화살표로 화면을 넘김
    // (카드 안의 가짜 Tiếp theo와 헷갈리지 않게 모양을 완전히 다르게)
    // 카드 세로 중앙(문제/키패드 중간 높이)에 맞춰 절대위치로 붙입니다.
    const bodyAndNav =
      trial.use_arrow_nav && !multi
        ? `<div style="position:relative;">
             ${trial.mockup_html || ""}
             <button class="nav-arrow-btn" data-i="0" aria-label="${trial.buttons[0]}"
               style="position:absolute; top:50%; right:-97px; transform:translateY(-50%);">→</button>
           </div>`
        : `${trial.mockup_html || ""}<div class="btn-row">${btnsHtml}</div>`;

    // content-col: 모든 화면(타이틀/지시문/문항/닫기/경고)이 항상 동일한 폭·위치를 쓰도록
    // 고정폭 가운데 정렬 컬럼으로 통일 — 화면마다 카드 위치가 달라지지 않게 함.
    display_element.innerHTML = `
      <div class="math-wrap">
        <div class="content-col">
          ${trial.tag ? `<div class="math-header"><div class="math-tag">${trial.tag}</div></div>` : ""}
          ${trial.body_html}
          ${bodyAndNav}
        </div>
      </div>`;

    initMockupAnimation(display_element);

    display_element.querySelectorAll("[data-i]").forEach((btn) => {
      btn.addEventListener("click", () => {
        clearMockupAnim();
        this.jsPsych.finishTrial({ response: trial.buttons[btn.dataset.i] });
      });
    });
  }
}

// ── 커스텀 플러그인: 문제 5초 제시 → 30초 응답(키패드) → 1초 차폐 ──
class MathItemPlugin {
  static info = {
    name: "math-item",
    version: "1.0.0",
    parameters: {
      question: { type: ParameterType.HTML_STRING, default: undefined },
      correct_answer: { type: ParameterType.STRING, default: undefined },
      item_index: { type: ParameterType.INT, default: 1 },
      total_items: { type: ParameterType.INT, default: 1 },
    },
    data: {
      response: { type: ParameterType.STRING },
      correct: { type: ParameterType.BOOL },
      omission: { type: ParameterType.BOOL },
      false_alarm: { type: ParameterType.BOOL },
      rt: { type: ParameterType.INT },
      decision_time: { type: ParameterType.INT },
      total_rt: { type: ParameterType.INT },
      retype_count: { type: ParameterType.INT },
      viewed_again: { type: ParameterType.BOOL },
    },
  };

  constructor(jsPsych) { this.jsPsych = jsPsych; }

  trial(display_element, trial) {
    const PROBLEM_MS = 5000;
    const RESPONSE_MS = 30000;
    const MASK_MS = 1000;

    let response = "";
    let viewedAgain = false;
    let retypeCount = 0;
    let startRT = null;
    let firstResponseRT = null;
    let countdownId = null;

    const progressLabel = `Câu hỏi ${String(trial.item_index).padStart(2, "0")} / ${String(trial.total_items).padStart(2, "0")}`;

    const header = `
      <div class="math-header">
        <div class="math-tag">Tính toán số học</div>
        <div class="math-progress-wrap">
          <div class="timer-badge" id="time-warn"></div>
          <div class="math-progress">${progressLabel}</div>
        </div>
      </div>`;

    // 응답 제한 30초 중 5초 이하 남았을 때만 카운트다운을 화면에 보여줌 ("비고" 항목 반영)
    const updateTimeWarn = (remaining) => {
      const el = document.getElementById("time-warn");
      if (!el) return;
      if (remaining > 0 && remaining <= 5) { el.textContent = `⏱ ${remaining}`; el.classList.add("on"); } else { el.textContent = ""; el.classList.remove("on"); }
    };

    // 1) 문제만 5초 제시 (입력 UI 숨김)
    display_element.innerHTML = `
      <div class="math-wrap">
        <div class="content-col">
          ${header}
          <div class="question-card">${trial.question}</div>
        </div>
      </div>`;

    setTimeout(() => {
      startRT = performance.now();
      renderResponsePhase();
      startCountdown();
    }, PROBLEM_MS);

    // 2) 30초 응답 단계 — Xem lại | 입력값 | Nhập lại 한 줄, 그 아래 키패드(1~9), 그 아래 Tiếp theo
    const renderResponsePhase = () => {
      display_element.innerHTML = `
        <div class="math-wrap">
          <div class="content-col">
            ${header}
            <div class="response-card">
              <div class="control-row">
                <button class="side-btn" id="again-btn">Xem lại</button>
                <div class="answer-box">
                  <span class="label">Đáp án đã nhập</span>
                  <span class="value" id="answer-display">${response || "&nbsp;"}</span>
                </div>
                <button class="side-btn" id="retype-btn">Nhập lại</button>
              </div>
              <div class="keypad" id="keypad">
                ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-digit="${n}">${n}</button>`).join("")}
                <button class="keypad-blank" disabled aria-hidden="true"></button>
                <button data-digit="0">0</button>
                <button class="keypad-backspace" id="backspace-btn" aria-label="Xóa">⌫</button>
              </div>
              <button class="next-btn" id="next-btn" ${response ? "" : "disabled"}>Tiếp theo →</button>
            </div>
          </div>
        </div>`;

      // 입력값이 비어있으면 "Tiếp theo"를 아예 누를 수 없게 막음(답을 안 하면 못 넘어감) —
      // 30초 시간 초과로만 응답 없이 종료될 수 있습니다.
      const nextBtn = document.getElementById("next-btn");
      const updateNextBtnState = () => { nextBtn.disabled = response === ""; };

      display_element.querySelectorAll("[data-digit]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (firstResponseRT === null) firstResponseRT = performance.now();
          response += btn.dataset.digit;
          document.getElementById("answer-display").innerHTML = response;
          updateNextBtnState();
        });
      });

      // 지우기(backspace) — "Nhập lại"(전체 삭제)와 달리 한 글자씩만 지움
      document.getElementById("backspace-btn").addEventListener("click", () => {
        if (firstResponseRT === null) firstResponseRT = performance.now();
        response = response.slice(0, -1);
        document.getElementById("answer-display").innerHTML = response || "&nbsp;";
        updateNextBtnState();
      });

      const againBtn = document.getElementById("again-btn");
      if (viewedAgain) againBtn.disabled = true;
      againBtn.addEventListener("click", () => {
        if (viewedAgain) return;
        viewedAgain = true;
        // 비고: "'다시 보기'를 누른 경우, 응답 제한 시간은 중지 없이 계속 진행될 것" —
        // countdownId를 멈추지 않고 그대로 흘러가게 둔 채 2초간 문제만 다시 보여줍니다.
        display_element.innerHTML = `
          <div class="math-wrap">
            <div class="content-col">
              ${header}
              <div class="question-card">${trial.question}</div>
            </div>
          </div>`;
        setTimeout(() => { renderResponsePhase(); }, 2000); // 2초간 다시 보여줌 (디자인에 구체적 시간 미지정); 타이머는 끊김 없이 계속 진행
      });

      document.getElementById("retype-btn").addEventListener("click", () => {
        retypeCount++;
        response = "";
        document.getElementById("answer-display").innerHTML = "&nbsp;";
        updateNextBtnState();
      });

      // 입력값이 있을 때만 endTrial 호출 — disabled 속성으로도 막혀 있지만 이중 안전장치
      nextBtn.addEventListener("click", () => {
        if (response === "") return;
        endTrial(false);
      });
    };

    const startCountdown = () => {
      let remaining = RESPONSE_MS / 1000;
      updateTimeWarn(remaining);
      countdownId = setInterval(() => {
        remaining -= 1;
        updateTimeWarn(remaining);
        if (remaining <= 0) { clearInterval(countdownId); endTrial(true); } // 진짜 30초 시간 초과
      }, 1000);
    };

    const endTrial = (timedOut) => {
      clearInterval(countdownId);
      const endRT = performance.now();
      // 첫 반응시간: 문제 제시 이후 응답 화면이 뜬 시점부터 첫 키 입력까지
      const rt = firstResponseRT !== null ? Math.round(firstResponseRT - startRT) : null;
      // 결정시간: 첫 응답부터 "Tiếp theo"를 누르기(또는 시간 초과로 종료되기)까지
      const decisionTime = firstResponseRT !== null ? Math.round(endRT - firstResponseRT) : null;
      // 총 반응시간 = 첫 반응시간 + 결정시간
      const totalRT = rt !== null && decisionTime !== null ? rt + decisionTime : null;
      const correct = response === trial.correct_answer;
      // 누락오류: "Tiếp theo"로는 빈 답을 제출할 수 없으므로, 30초 시간 초과로
      // 강제 종료됐을 때 입력값이 비어있는 경우에만 누락오류로 기록합니다.
      const omission = timedOut && response === "";
      // 오경보오류: 응답은 했지만 정답이 아님
      const falseAlarm = !omission && !correct;

      // 1초 차폐
      display_element.innerHTML = `<div class="mask"></div>`;
      setTimeout(() => {
        this.jsPsych.finishTrial({
          response, correct, omission, false_alarm: falseAlarm,
          rt, decision_time: decisionTime, total_rt: totalRT,
          retype_count: retypeCount, viewed_again: viewedAgain,
        });
      }, MASK_MS);
    };
  }
}

// ── 결과 CSV 내보내기 ──
// jsPsych 기본 저장(localSave)은 지시문 화면 응답, stimulus/rt_key_duration/
// plugin_version 같은 내부 메타 열까지 전부 포함돼서 지저분합니다.
// 그래서 (1) 실제 문항(math_item)만 걸러내고 (2) 필요한 열만 직접 골라서
// CSV를 만들어 내려받습니다. 열을 더 넣거나 빼고 싶으면 아래 CSV_COLUMNS만
// 수정하면 됩니다.
const CSV_COLUMNS = [
  "code_name", "item_index", "question", "correct_answer", "response",
  "correct", "omission", "false_alarm",
  "rt", "decision_time", "total_rt",
  "retype_count", "viewed_again",
];

function csvEscape(value) {
  if (value === undefined || value === null) return "";
  const s = String(value);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// CSV 문자열만 만들어서 반환 (파일 다운로드는 하지 않음) — DataPipe 업로드에 사용됩니다.
function buildFilteredCSVString() {
  const rows = jsPsych.data.get().filter({ phase: "math_item" }).values();
  rows.forEach((r) => { r.code_name = subjectId; });
  const lines = [CSV_COLUMNS.join(",")];
  rows.forEach((row) => {
    lines.push(CSV_COLUMNS.map((col) => csvEscape(row[col])).join(","));
  });
  return lines.join("\n");
}

// 참가자 컴퓨터로 CSV 파일을 직접 내려받습니다. 더 이상 자동으로 호출하지 않지만,
// DataPipe 업로드가 실패했을 때 브라우저 콘솔에서 downloadFilteredCSV() 를 직접
// 호출하면 수동으로 백업 파일을 받을 수 있어 남겨둡니다.
function downloadFilteredCSV() {
  const blob = new Blob([buildFilteredCSVString()], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "math_test_data.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── DataPipe 자동 업로드 설정 ──
// 1) https://pipe.jspsych.org 에서 계정을 만들고(GitHub/OSF 로그인)
// 2) Google Drive(또는 OSF 등)를 연결한 뒤
// 3) "Vietnam_cognitive_test" 같은 이름으로 새 실험(Experiment)을 생성하면
// 4) 대시보드에 12자리 Experiment ID가 발급됩니다.
// 그 값을 아래 PIPE_EXPERIMENT_ID 에 그대로 붙여넣으면, 검사가 끝날 때마다
// 참가자의 결과 CSV가 자동으로 연결된 저장소(Google Drive 폴더)에 올라갑니다.
const PIPE_EXPERIMENT_ID = "kWfRmZqO824v";

// 참가자(세션)마다 다른 파일명을 쓰기 위한 임의 ID
function randomID(len = 10) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
const subjectId = (localStorage.getItem("vit_participant_code") || "").trim() || randomID(10);

// ── 타임라인 구성 ──
const jsPsych = initJsPsych({
  extensions: [
    {
      type: jsPsychExtensionPipe,
      params: {
        experiment_id: PIPE_EXPERIMENT_ID,
        filename: () => VIT.fileName(subjectId),
        data_string: buildFilteredCSVString,
      },
    },
  ],
  on_finish: () => VIT.finish(),
});

const timeline = [];

// ── 0) 타이틀 화면 (원본 PPT 슬라이드를 고해상도로 그대로 캡처한 이미지 한 장 —
//    배경 원이 잘려있던 부분은 이미지 자체를 보정해서 완전한 동그라미로 만들어둠) ──
// 다른 소검사들과 동일한 방식(설정 객체 + heroTrial() 함수)으로 통일
const TITLE = { iw: 2242, ih: 1575, safeX: 1454, px: 311, py: 1174, pw: 457, ph: 112 };
function heroTrial(imgSrc) {
  return {
    type: InfoScreenPlugin, hero: true, buttons: ["Bắt đầu"],
    body_html: `
      <div class="slide-wrap">
        <img class="slide-img" src="${imgSrc}" alt="Tính toán số học"
          data-iw="${TITLE.iw}" data-ih="${TITLE.ih}" data-safe-x="${TITLE.safeX}" />
        <button class="slide-hitbox" data-i="0" aria-label="Bắt đầu"
          data-px="${TITLE.px}" data-py="${TITLE.py}" data-pw="${TITLE.pw}" data-ph="${TITLE.ph}"></button>
      </div>`,
  };
}
timeline.push(heroTrial("images/title-slide.png"));

// ── 1) 지시문 화면들 (설명 + 응답카드 미리보기, 특정 버튼 하이라이트) ──
// instructionBlock 전체는 "Nghe lại hướng dẫn"(설명 다시 듣기)를 누르면 루프를 돌아 처음부터 다시 보여줌
const instructionBlock = [];
const instructionScreens = [
  {
    body_html: `<div class="info-box">
        Trong bài kiểm tra này, câu hỏi được hiển thị trong <b>5 giây</b>.<br>
        Sau khi đọc câu hỏi được hiển thị ngắn,<br>
        hãy nhập đáp án bằng <b>bàn phím</b> xuất hiện trên màn hình.
      </div>`,
    // 뒤에 이어지는 다른 설명 화면들(86)과 숫자를 통일
    mockup: mockupCard({ animateDigits: ["8", "6"] }),
  },
  {
    // "Tiếp theo" 설명 — 키패드 애니메이션 없이, 카드 안 Tiếp theo 버튼이 주기적으로 눌리는 연출만
    body_html: `<div class="info-box">
        Sau khi nhập đáp án,<br>
        hãy nhấn nút <b>"Tiếp theo"</b> để tiếp tục bài kiểm tra.
      </div>`,
    mockup: mockupCard({ answerValue: "86", highlight: "next", animType: "press-next" }),
  },
  {
    // "Xem lại" 설명 — 키패드 애니메이션 없이, Xem lại 버튼이 눌리면서 문제(80+6=86)가 잠깐 다시 보였다 사라지는 연출
    // 입력값(86)과 다시 보기로 뜨는 문제(80+6=86)가 서로 일치하도록 통일
    body_html: `<div class="info-box">
        Mỗi câu hỏi <b>chỉ có thể xem lại một lần</b><br>
        bằng cách nhấn nút <b>"Xem lại"</b> ở bên trái.
      </div>`,
    mockup: mockupCard({
      answerValue: "86",
      highlight: "again",
      animType: "press-again",
      animQuestion: "Lan có 80 viên bi.<br>Mẹ cho Lan thêm 6 viên bi.<br>Lan có tất cả bao nhiêu viên bi?",
    }),
  },
  {
    // "Nhập lại" 설명 — 키패드 애니메이션 없이, Nhập lại 버튼이 눌리면서 입력값(86)이 사라졌다 돌아오는 연출
    body_html: `<div class="info-box">Để sửa đáp án, hãy nhấn nút <b>"Nhập lại"</b>.</div>`,
    mockup: mockupCard({ answerValue: "86", highlight: "retype", animType: "press-retype", animValue: "86" }),
  },
  {
    // 자유 수정 설명 — 다른 화면들과 동일하게 86을 입력하는 연출로 통일
    body_html: `<div class="info-box">
        Bạn có thể thay đổi câu trả lời thoải mái<br>
        trước khi nhấn nút <b>"Tiếp theo"</b>.
      </div>`,
    mockup: mockupCard({ animateDigits: ["8", "6"], highlight: "next" }),
  },
  {
    // 제한시간 자동 진행 + 응답 속도/정확성 안내 — 기획서 원문 문단의 마지막 두 문장이
    // 기존 vi 버전에는 빠져 있었던 것을 ko 버전과 동일하게 추가했습니다.
    body_html: `<div class="info-box">
        Ngay cả khi bạn đang nhập đáp án, nếu hết <b>thời gian giới hạn</b>,<br>
        câu hỏi tiếp theo sẽ tự động xuất hiện.<br>
        Vui lòng trả lời <b>nhanh và chính xác</b> nhất có thể.
      </div>`,
    mockup: mockupCard({ answerValue: "86", selectedDigit: 6 }),
  },
];

instructionScreens.forEach((s) => {
  instructionBlock.push({
    type: InfoScreenPlugin,
    tag: "Tính toán số học",
    body_html: s.body_html,
    mockup_html: s.mockup,
    buttons: ["Tiếp theo →"],
    use_arrow_nav: true,
  });
});

// ── 2) 예시 문항 체험 (실제 채점 없이 보여주기만 함) ──
instructionBlock.push({
  type: InfoScreenPlugin,
  tag: "Tính toán số học",
  body_html: `<div class="info-box">
      Chúng ta sẽ thử giải một câu hỏi ví dụ.<br>
      Câu hỏi được đưa ra là:<br>
      “Tổng số kẹo Bình có và số kẹo Thủy cho thêm là bao nhiêu?”.
    </div>`,
  mockup_html: `<div class="question-card">
      Bình có 4 chiếc kẹo.<br>Nếu Thủy cho thêm 2 chiếc kẹo,<br>Bình có tất cả bao nhiêu chiếc kẹo?
    </div>`,
  buttons: ["Tiếp theo →"],
  use_arrow_nav: true,
});

instructionBlock.push({
  type: InfoScreenPlugin,
  tag: "Tính toán số học",
  body_html: `<div class="info-box">
      Số kẹo Bình có và số kẹo Thủy cho thêm lần lượt là 4 cái và 2 cái.<br>
      Vì 4 cộng 2 bằng 6, nên bạn cần sử dụng bàn phím để nhập số 6.
    </div>`,
  mockup_html: mockupCard({ animateDigits: ["6"] }),
  buttons: ["Tiếp theo →"],
  use_arrow_nav: true,
});

// ── 3) 안내 종료 화면: "다시 듣기"를 누르면 instructionBlock 전체가 루프로 다시 재생됨 ──
// (디자인처럼 카드 안에는 버튼 없이 control-row+키패드만, 실제 두 버튼은 카드 아래쪽에 별도로 배치)
instructionBlock.push({
  type: InfoScreenPlugin,
  tag: "Tính toán số học",
  body_html: `<div class="info-box">
      Nếu muốn nghe lại phần hướng dẫn, hãy nhấn nút "Nghe lại hướng dẫn".<br>
      Để bắt đầu bài kiểm tra, hãy nhấn nút "Bắt đầu kiểm tra".
    </div>`,
  mockup_html: mockupCard({ answerValue: "6", selectedDigit: 6, button: null }),
  buttons: ["Nghe lại hướng dẫn", "Bắt đầu kiểm tra"],
});

// instructionBlock 전체를 루프 노드로 감싸서 "Nghe lại hướng dẫn" 클릭 시 처음부터 반복
timeline.push({
  timeline: instructionBlock,
  loop_function: (data) => {
    const last = data.values()[data.values().length - 1];
    return last.response === "Nghe lại hướng dẫn";
  },
});

// "Bắt đầu kiểm tra"를 누른 직후 바로 첫 문제로 넘어가지 않고, 제한시간 자동진행 +
// 빠르고 정확히 안내를 다시 보여주는 전환 화면 2장(버튼 없이 각 2초 후 자동 진행)
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: () => transitionScreen([
    "Khi hết thời gian",
    "quy định cho mỗi câu hỏi,",
    "hệ thống sẽ tự động",
    "chuyển sang",
    "câu tiếp theo.",
  ]),
  choices: "NO_KEYS",
  trial_duration: 2500,
});
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: () => transitionScreen([
    "Hãy trả lời",
    "<b>nhanh và chính xác</b>",
    "nhất có thể.",
  ]),
  choices: "NO_KEYS",
  trial_duration: 2500,
});

let consecutiveZero = 0;

ITEMS.forEach((item, idx) => {
  timeline.push({
    // 중지 규칙: 5문항 연속 0점이면 이후 문항은 건너뜀 (감싼 timeline 노드의 conditional_function)
    conditional_function: () => consecutiveZero < 5,
    timeline: [{
    type: MathItemPlugin,
    question: item.question,
    correct_answer: item.answer,
    item_index: idx + 1,
    total_items: ITEMS.length,
    data: { phase: "math_item", item_index: idx + 1, question: item.question, correct_answer: item.answer },
    on_finish: (data) => {
      consecutiveZero = data.correct ? 0 : consecutiveZero + 1;
    },
    }],
  });
});

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: VIT.endStimulus(`<h1>Bài kiểm tra đã kết thúc.</h1><p>Kết quả đang được tự động lưu lại. Nhấn phím cách (Space) để kết thúc.</p>`),
  choices: [" "],
  trial_duration: VIT.endDuration(),
});

jsPsych.run(timeline);
</script>
